[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labia"
version = "0.1.0"
description = "Lab-IA — núcleo Python: treinamento, fine-tuning, quantização, MoE, raciocínio, agentes."
requires-python = ">=3.13,<3.15"
dependencies = [
  "torch>=2.6",
  "tokenizers>=0.21",
  "transformers>=4.49",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
finetune = ["datasets>=3", "peft>=0.14", "accelerate>=1"]
quant = ["bitsandbytes>=0.45"]
viz = ["matplotlib>=3.8"]  # só para curva em PNG; a curva em SVG não precisa de nada

[project.scripts]
lab-ia = "labia.cli:main"

[tool.setuptools.packages.find]
include = ["labia*"]
