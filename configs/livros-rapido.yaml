# Lab-IA — config de treino do zero (preset: rapido)
# gerado por 'lab-ia novo' — primeiro treino de verdade: resultados visíveis em poucos minutos
#
# parâmetros: 2.600.064 totais / 2.600.064 ativos por token
# estimativa: 326.898 tokens/s → 14.1 s
# VRAM estimada: 193.8 MB (39.7 MB de otimizador)
# corpus: ~222.493 tokens → 2.316 janelas → 10.42 épocas em 1000 passos
#
# edite à vontade: o treino recusa chave desconhecida em vez de ignorar em silêncio

nome: livros-rapido             # identificador do run; vira a pasta runs/<nome>/
corpus: 'data\livros-ptbr\trem.txt'  # arquivo de treino (texto puro, UTF-8)
corpus_val: 'data\livros-ptbr\val.txt'  # arquivo de validação; se vazio, o treino divide o corpus (95/5)
vocab_bpe: 4096                 # tamanho do vocabulário BPE; maior = menos tokens por palavra, embedding maior
passos: 1000                    # passos de otimização (um lote por passo)
lote: 24                        # sequências por passo
stride: 96                      # passo entre janelas; menor que janela_ctx = janelas deslizantes (aproveita corpus pequeno)
avaliar_a_cada: 100             # intervalo de avaliação na validação (mede generalização)
salvar_a_cada: 100              # intervalo de checkpoint atômico (é o que permite retomar após queda)
iters_avaliacao: 40             # quantos lotes de validação por avaliação
lr: 0.0003                      # learning rate de pico
minimo_lr: 3.0e-05              # piso do decaimento cosseno
warmup: 60                      # passos de aquecimento linear (evita divergir no começo)
peso_decay: 0.1                 # weight decay do AdamW (só em pesos 2D; embeddings de posição ficam fora)
grad_clip: 1.0                  # norma máxima do gradiente (0 desliga)
semente: 42                     # semente; com o mesmo corpus e semente o treino é reproduzível
dispositivo: auto               # auto | cuda | cpu
modelo:
  dim: 192                      # largura (dimensão do resíduo)
  camadas: 4                    # profundidade (blocos transformer)
  cabecas: 6                    # cabeças de atenção; dim precisa ser divisível por cabecas
  janela_ctx: 192               # contexto máximo em tokens
  abandono: 0.05                # dropout (0 desliga; corpus pequeno costuma pedir mais)
