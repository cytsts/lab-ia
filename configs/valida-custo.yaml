# Lab-IA — config de treino do zero (preset: micro)
# gerado por 'lab-ia novo' — teste de fumaça: minutos em GPU, horas em CPU — use para validar a config
#
# parâmetros: 888.448 totais / 888.448 ativos por token
# estimativa: 633.788 tokens/s → 7.8 s
# VRAM estimada: 157.6 MB (13.6 MB de otimizador)
# corpus: ~222.493 tokens → 869 janelas → 22.22 épocas em 600 passos
#
# edite à vontade: o treino recusa chave desconhecida em vez de ignorar em silêncio

nome: valida-custo              # identificador do run; vira a pasta runs/<nome>/
corpus: 'data\livros-ptbr\trem.txt'  # arquivo de treino (texto puro, UTF-8)
corpus_val: 'data\livros-ptbr\val.txt'  # arquivo de validação; se vazio, o treino divide o corpus (95/5)
vocab_bpe: 2048                 # tamanho do vocabulário BPE; maior = menos tokens por palavra, embedding maior
passos: 600                     # passos de otimização (um lote por passo)
lote: 32                        # sequências por passo
stride: 0                       # passo entre janelas; menor que janela_ctx = janelas deslizantes (aproveita corpus pequeno)
avaliar_a_cada: 50              # intervalo de avaliação na validação (mede generalização)
salvar_a_cada: 100              # intervalo de checkpoint atômico (é o que permite retomar após queda)
iters_avaliacao: 40             # quantos lotes de validação por avaliação
lr: 0.0006                      # learning rate de pico
minimo_lr: 6.0e-05              # piso do decaimento cosseno
warmup: 40                      # passos de aquecimento linear (evita divergir no começo)
peso_decay: 0.1                 # weight decay do AdamW (só em pesos 2D; embeddings de posição ficam fora)
grad_clip: 1.0                  # norma máxima do gradiente (0 desliga)
semente: 42                     # semente; com o mesmo corpus e semente o treino é reproduzível
dispositivo: auto               # auto | cuda | cpu
modelo:
  dim: 128                      # largura (dimensão do resíduo)
  camadas: 3                    # profundidade (blocos transformer)
  cabecas: 4                    # cabeças de atenção; dim precisa ser divisível por cabecas
  janela_ctx: 256               # contexto máximo em tokens
  abandono: 0.0                 # dropout (0 desliga; corpus pequeno costuma pedir mais)
